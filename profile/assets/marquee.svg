<svg xmlns="http://www.w3.org/2000/svg" width="900" height="56" viewBox="0 0 900 56" role="img" aria-label="All repositories are open source" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#111b24"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.08" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.92" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edge"><rect width="900" height="56" fill="url(#fade)"/></mask>
  </defs>
  <rect width="900" height="56" rx="10" fill="url(#bg)" stroke="#3DDC97" stroke-opacity="0.35"/>
  <g mask="url(#edge)" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="15" font-weight="600" fill="#3DDC97">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="18s" repeatCount="indefinite"/>
      <text x="0" y="34" textLength="900" lengthAdjust="spacing">ALL REPOSITORIES ARE OPEN SOURCE  //  NETWORKING  //  AI  //  INFRASTRUCTURE  //  TOOLING  //</text>
      <text x="-900" y="34" textLength="900" lengthAdjust="spacing">ALL REPOSITORIES ARE OPEN SOURCE  //  NETWORKING  //  AI  //  INFRASTRUCTURE  //  TOOLING  //</text>
    </g>
  </g>
</svg>
